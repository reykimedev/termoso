[package]
name = "labterm-mobile"
description = "Labterm mobile façade: UniFFI bindings over labterm-core for the Android and iOS clients"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "labterm_mobile"

[dependencies]
labterm-core = { workspace = true, features = ["local-pty", "fido2-ctap"] }
labterm-client = { workspace = true, features = ["oidc-cert", "vpn"] }
labterm-proto = { workspace = true }
labterm-crypto = { workspace = true }
# Embedded NetBird: the Go library is only bundled in the Android app; elsewhere
# a host set to use NetBird fails with "not available in this build".

uniffi = { workspace = true }
alacritty_terminal = { workspace = true }
russh = { version = "0.65", features = ["rsa"] }

tokio = { workspace = true }
tokio-util = { version = "0.7" }
bytes = { workspace = true }
async-trait = "0.1"
encoding_rs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = "1"
tar = "0.4"
sha2 = { workspace = true }
futures-util = "0.3"
xz2 = "0.1"
lzma-sys = { version = "0.1", features = ["static"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[dev-dependencies]
labterm-core = { workspace = true, features = ["fido2-soft"] }
tempfile = "3"
rand = "0.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
