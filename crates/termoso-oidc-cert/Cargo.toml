[package]
name = "termoso-oidc-cert"
description = "OpenPubkey SSH certificates (byte-compatible with opkssh) from an OIDC login: auth code + PKCE, PK token, self-signed OpenSSH certificate"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Same versions russh 0.65 uses, so the key and certificate types are shared.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["alloc", "std", "ecdsa", "p256", "rand_core"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"
sha3 = "0.11"
base64 = { workspace = true }
rand = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# `http`: discovery and the token request. reqwest uses fetch() on wasm32.
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser randomness for rand / ssh-key.
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["http", "loopback"]
http = ["dep:reqwest"]
# Native only: receive the redirect on http://localhost:<port>/login-callback.
loopback = ["http", "dep:tokio"]
# TLS backend for native builds (the browser brings its own).
rustls = ["reqwest?/rustls-tls"]

[dev-dependencies]
tokio = { workspace = true }
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519"] }
