[package]
name = "hatch-wasm"
description = "The browser side of Hatch in WebAssembly: SSH over the relay, the known-hosts check, key tools, the lock key, and termoso-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Termoso's own browser crypto (OPAQUE, account and vault keys, entity encryption) at the pinned
# release, built into the same module so there is one wasm file and one wasm-bindgen version.
termoso-wasm = { path = "../../web/upstream/crates/termoso-wasm" }
# opkssh certificates from the Authentik sign-in. Lives in the Termoso fork until it is upstream;
# pinned to a commit. Only the core: the browser does the HTTP itself.
termoso-oidc-cert = { git = "https://github.com/reykimedev/termoso", rev = "f77dc6bb9a791b71efbaf1988ccfdb5d04e39610", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Same russh as Termoso v0.12.1, with ring instead of aws-lc-rs (aws-lc-sys has no wasm32 build).
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
# ring 0.17 uses getrandom 0.2, which needs `js` on wasm32-unknown-unknown.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }
futures = "0.3"
serde = { workspace = true }
base64 = { workspace = true }
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event"] }
url = "2"

[lints]
workspace = true

# wasm-opt would fetch binaryen at build time; the release profile's LTO is enough and keeps the
# build reproducible from the lockfile alone.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
