[package]
name = "labterm-client"
description = "Termoso client façades shared by the desktop and mobile shells: host editor, keychain, typed errors"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
labterm-core = { workspace = true }
labterm-proto = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }
labterm-oidc-cert = { workspace = true, optional = true, features = ["loopback", "rustls"] }

[features]
default = ["fido2"]
# FIDO2 security keys in the keychain (needs USB HID; off on Android).
fido2 = ["labterm-core/fido2"]
# OpenPubkey (opkssh) certificates: per-key OpenID sign-in before connecting.
oidc-cert = ["dep:labterm-oidc-cert"]


[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
