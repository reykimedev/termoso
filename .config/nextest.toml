# cargo-nextest runs every test in its own process and many at once, across all test
# binaries (cargo test runs the binaries one after another). Doc tests are not covered:
# run `cargo test --doc` next to it.

[profile.default]
# Report tests that hang instead of waiting forever; nothing here should take a minute.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Run everything and list all failures, not just the first.
fail-fast = false
failure-output = "immediate-final"
