{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "labterm.secretName" . }}
  labels:
    {{- include "labterm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.LABTERM_MASTER_KEY }}
  {{- fail "secrets.LABTERM_MASTER_KEY is required (openssl rand -base64 32)" }}
  {{- end }}
  {{- range $k, $v := .Values.secrets }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- if and (not .Values.database.existingSecret) (include "labterm.databaseUrl" .) }}
  LABTERM_DATABASE_URL: {{ include "labterm.databaseUrl" . | quote }}
  {{- end }}
  {{- if and (not .Values.redis.existingSecret) (include "labterm.redisUrl" .) }}
  LABTERM_REDIS_URL: {{ include "labterm.redisUrl" . | quote }}
  {{- end }}
  {{- if .Values.bundled.rustfs.enabled }}
  LABTERM_S3__ACCESS_KEY: {{ .Values.bundled.rustfs.accessKey | quote }}
  LABTERM_S3__SECRET_KEY: {{ .Values.bundled.rustfs.secretKey | quote }}
  {{- else if not .Values.s3.existingSecret }}
  LABTERM_S3__ACCESS_KEY: {{ .Values.s3.accessKey | quote }}
  LABTERM_S3__SECRET_KEY: {{ .Values.s3.secretKey | quote }}
  {{- end }}
{{- end }}
