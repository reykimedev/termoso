apiVersion: apps/v1
kind: Deployment
metadata:
  name: hatch-relay
spec:
  replicas: 1 # single use of a ticket is tracked in memory, so one replica
  selector:
    matchLabels:
      app.kubernetes.io/name: hatch-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hatch-relay
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/bitsandbricks-ch/hatch-relay
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HATCH_RELAY_LISTEN
              value: "0.0.0.0:8080"
            - name: HATCH_RELAY_ALLOWLIST_FILE
              value: /etc/hatch/allowlist.yaml
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: allowlist, mountPath: /etc/hatch, readOnly: true }
      volumes:
        - name: allowlist
          configMap:
            name: hatch-relay-allowlist
---
apiVersion: v1
kind: Service
metadata:
  name: hatch-relay
spec:
  selector:
    app.kubernetes.io/name: hatch-relay
  ports:
    - name: http
      port: 80
      targetPort: http
