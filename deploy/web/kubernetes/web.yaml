apiVersion: apps/v1
kind: Deployment
metadata:
  name: labterm-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: labterm-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labterm-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/reykimedev/labterm-web
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Deployment data next to index.html; not part of the signed release.
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: labterm-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: labterm-web
spec:
  selector:
    app.kubernetes.io/name: labterm-web
  ports:
    - name: http
      port: 80
      targetPort: http
