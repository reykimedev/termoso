# Public: the work PC reaches both over the internet. One certificate per host, no wildcard.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: labterm-web
spec:
  secretName: labterm-web-tls
  issuerRef:
    name: ${CLUSTER_ISSUER}
    kind: ClusterIssuer
  dnsNames:
    - labterm.example.com # TODO: your public name for the app
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: labterm-relay
spec:
  secretName: labterm-relay-tls
  issuerRef:
    name: ${CLUSTER_ISSUER}
    kind: ClusterIssuer
  dnsNames:
    - relay.labterm.example.com # TODO: your public name for the relay
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: labterm-web
  labels:
    traefik-instance: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`labterm.example.com`)
      kind: Rule
      services:
        - name: labterm-web
          port: 80
  tls:
    secretName: labterm-web-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: labterm-relay
  labels:
    traefik-instance: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`relay.labterm.example.com`)
      kind: Rule
      services:
        - name: labterm-relay
          port: 80
  tls:
    secretName: labterm-relay-tls
