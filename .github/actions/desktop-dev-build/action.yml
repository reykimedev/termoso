name: Build Labterm Dev
description: Builds unsigned Labterm Dev bundles for one platform and uploads them as a workflow artifact (devel.yml).
inputs:
  bundles:
    description: Tauri bundle types, comma separated
    required: true
  artifact:
    description: Platform name (linux-x86_64, windows-x86_64, macos-aarch64)
    required: true
  version:
    description: Dev version, e.g. 0.12.2-dev.42
    required: true
runs:
  using: composite
  steps:
    - name: Tauri system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libudev-dev libssl-dev patchelf file xdg-utils
    - name: Labterm linuxdeploy appimage plugin
      if: runner.os == 'Linux'
      shell: bash
      run: apps/desktop/src-tauri/appimage/prepare.sh

    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: desktop-dev-${{ inputs.artifact }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: apps/desktop/package-lock.json
    - shell: bash
      working-directory: apps/desktop
      run: npm ci --no-audit --no-fund
    # The embedded VPN client (crates/labterm-netbird/go), bundled next to the app.
    # No Windows build of it yet.
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      if: runner.os != 'Windows'
      with:
        go-version-file: crates/labterm-netbird/go/go.mod
        cache-dependency-path: crates/labterm-netbird/go/go.sum
    - name: VPN client library
      if: runner.os != 'Windows'
      shell: bash
      run: apps/desktop/src-tauri/vpn/build.sh

    - name: Build
      shell: bash
      working-directory: apps/desktop
      env:
        LABTERM_CHANNEL: dev
        LABTERM_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download/desktop-dev/latest.json
        VERSION: ${{ inputs.version }}
        BUNDLES: ${{ inputs.bundles }}
      run: |
        cfg="$RUNNER_TEMP/dev.json"
        jq --arg v "$VERSION" '. + {version: $v}' src-tauri/channels/dev.json > "$cfg"
        npm run tauri -- build --bundles "$BUNDLES" --config "$cfg"

    # Fixed names, so each build replaces the last one on the rolling release.
    - name: Collect bundles
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        out="$RUNNER_TEMP/out"
        mkdir -p "$out"
        b=target/release/bundle
        case "$ARTIFACT" in
          linux-*)
            cp $b/appimage/*.AppImage "$out/Labterm-Dev_amd64.AppImage"
            cp $b/deb/*.deb "$out/Labterm-Dev_amd64.deb"
            ;;
          windows-*)
            cp $b/nsis/*-setup.exe "$out/Labterm-Dev_x64-setup.exe"
            ;;
          macos-*)
            # The updater artifact Tauri would make: the .app as a gzipped tarball.
            COPYFILE_DISABLE=1 tar -czf "$out/Labterm-Dev_aarch64.app.tar.gz" -C $b/macos "Labterm Dev.app"
            cp $b/dmg/*.dmg "$out/Labterm-Dev_aarch64.dmg"
            ;;
        esac
        ls -l "$out"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: desktop-dev-${{ inputs.artifact }}
        path: ${{ runner.temp }}/out/*
        if-no-files-found: error
        retention-days: 7
