# Debug channel: every push to the listed branches builds a "Labterm Debug" APK signed
# with a fixed debug key and publishes it to a rolling prerelease, together with
# latest.json, which the in-app updater of those builds reads. Each branch has its own
# channel (`android-debug` for feat/opkssh-certificates, `android-debug-<branch>` for
# the others), so an installed build only ever updates from the branch it came from.
#
# Secrets of the GitHub environment `android-debug` (deployments limited to main; skipped without them):
#   ANDROID_DEBUG_KEYSTORE_BASE64     debug-channel keystore (`base64 -w0 labterm-debug.jks`, alias `labterm-debug`)
#   ANDROID_DEBUG_KEYSTORE_PASSWORD   its store/key password
name: Android debug channel

on:
  push:
    branches: [main]
    # Only pushes that change the APK publish a new debug build.
    paths:
      - apps/android/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/android-debug-channel.yml
  workflow_dispatch:

permissions:
  contents: read

# A running publish always finishes; a newer push waits and supersedes any older waiting one.
concurrency:
  group: android-debug-channel-${{ github.ref_name }}
  cancel-in-progress: false

# Same as CI: rust-cache keys on these, so the publish job can reuse CI's android cache.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  publish:
    name: debug APK → android-debug prerelease
    runs-on: ubuntu-latest
    # The signing key lives in this environment, so only branches it allows can sign.
    environment: android-debug
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; skipping the debug channel"
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_KEY == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - if: env.HAS_KEY == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          # Keeps main's android cache current even when CI's android job doesn't run on main.
          # It only saves when the job finishes, not when a newer push cancels it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.HAS_KEY == 'true'
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-ndk@4.1.2
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: env.HAS_KEY == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - if: env.HAS_KEY == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: crates/labterm-netbird/go/go.mod
          cache-dependency-path: crates/labterm-netbird/go/go.sum
      - name: Channel
        if: env.HAS_KEY == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "feat/opkssh-certificates" ]; then
            tag=android-debug
          else
            tag="android-debug-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')"
          fi
          echo "CHANNEL_TAG=$tag" >> "$GITHUB_ENV"
      - name: Debug keystore from secrets
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labterm-debug.jks"
          echo "LABTERM_ANDROID_DEBUG_KEYSTORE=$RUNNER_TEMP/labterm-debug.jks" >> "$GITHUB_ENV"
      - name: Build
        if: env.HAS_KEY == 'true'
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          LABTERM_ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          LABTERM_DEBUG_BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          UPDATE_URL="https://github.com/$REPO/releases/download/$CHANNEL_TAG/latest.json"
          ./gradlew --no-daemon -Plabterm.abis=arm64-v8a "-Plabterm.debugUpdateUrl=$UPDATE_URL" :app:assembleDebug
      - name: Publish
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          out="$RUNNER_TEMP/channel"
          mkdir -p "$out"
          cp apps/android/app/build/outputs/apk/debug/*.apk "$out/labterm-debug.apk"
          sha=$(sha256sum "$out/labterm-debug.apk" | cut -d' ' -f1)
          size=$(stat -c %s "$out/labterm-debug.apk")
          jq -n --argjson build "$BUILD" --arg commit "$COMMIT" --arg sha "$sha" --argjson size "$size" \
            '{build: $build, commit: $commit, apk: "labterm-debug.apk", sha256: $sha, size: $size}' > "$out/latest.json"
          if ! gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release create "$CHANNEL_TAG" --prerelease --target "$COMMIT" \
              --title "Labterm Debug (rolling, $CHANNEL_TAG)" \
              --notes "Debug builds for testing; the app updates itself from here. Not for production use."
          fi
          gh release upload "$CHANNEL_TAG" "$out/labterm-debug.apk" "$out/latest.json" --clobber
          gh release edit "$CHANNEL_TAG" --title "Labterm Debug (rolling, $CHANNEL_TAG)" --notes "Debug build $BUILD from $COMMIT. The app updates itself from here."
