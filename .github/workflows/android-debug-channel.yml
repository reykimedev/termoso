# Debug channel: every push to the listed branches builds a "Termoso Debug" APK signed
# with a fixed debug key and publishes it to the rolling prerelease `android-debug`,
# together with latest.json, which the in-app updater of those builds reads.
#
# Repository secrets (skipped without them):
#   ANDROID_DEBUG_KEYSTORE_BASE64     debug-channel keystore (`base64 -w0 termoso-debug.jks`, alias `termoso-debug`)
#   ANDROID_DEBUG_KEYSTORE_PASSWORD   its store/key password
name: Android debug channel

on:
  push:
    branches: [feat/opkssh-certificates]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-channel
  cancel-in-progress: true

jobs:
  publish:
    name: debug APK → android-debug prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; skipping the debug channel"
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_KEY == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - if: env.HAS_KEY == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: false
      - if: env.HAS_KEY == 'true'
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-ndk@4.1.2
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: env.HAS_KEY == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - if: env.HAS_KEY == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Debug keystore from secrets
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/termoso-debug.jks"
          echo "TERMOSO_ANDROID_DEBUG_KEYSTORE=$RUNNER_TEMP/termoso-debug.jks" >> "$GITHUB_ENV"
      - name: Build
        if: env.HAS_KEY == 'true'
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          TERMOSO_ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          TERMOSO_DEBUG_BUILD: ${{ github.run_number }}
          UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/android-debug/latest.json
        run: ./gradlew --no-daemon -Ptermoso.abis=arm64-v8a "-Ptermoso.debugUpdateUrl=$UPDATE_URL" :app:assembleDebug
      - name: Publish
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          out="$RUNNER_TEMP/channel"
          mkdir -p "$out"
          cp apps/android/app/build/outputs/apk/debug/*.apk "$out/termoso-debug.apk"
          sha=$(sha256sum "$out/termoso-debug.apk" | cut -d' ' -f1)
          jq -n --argjson build "$BUILD" --arg commit "$COMMIT" --arg sha "$sha" \
            '{build: $build, commit: $commit, apk: "termoso-debug.apk", sha256: $sha}' > "$out/latest.json"
          if ! gh release view android-debug >/dev/null 2>&1; then
            gh release create android-debug --prerelease --target "$COMMIT" \
              --title "Termoso Debug (rolling)" \
              --notes "Debug builds for testing; the app updates itself from here. Not for production use."
          fi
          gh release upload android-debug "$out/termoso-debug.apk" "$out/latest.json" --clobber
          gh release edit android-debug --notes "Debug build $BUILD from $COMMIT. The app updates itself from here."
