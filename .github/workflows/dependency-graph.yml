name: Dependency graph

# Gradle has no lockfile in this repo, so Dependabot only sees the direct
# dependencies declared in build.gradle.kts / libs.versions.toml. This resolves
# every configuration of the Android build and submits the full transitive
# graph to GitHub, so Dependabot alerts cover transitive Gradle dependencies
# the same way Cargo.lock / package-lock.json already do for Rust and npm.
on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - .github/workflows/dependency-graph.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gradle:
    name: gradle (android) → dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: apps/android
