name: Desktop release

# Builds signed desktop bundles, signed Android APKs and the unsigned iOS
# .ipa (sideload: signed on the user's side by AltStore/SideStore, see
# docs/IOS_SIDELOAD.md) with its AltStore source `labterm-altstore.json`.
# On a `v*` tag it assembles a draft GitHub release with the installers, their
# minisign `.sig` files and the updater manifest `latest.json`, then adds
# SHA256SUMS and publishes it once every asset is in place (so
# `releases/latest` never points at a half-uploaded release). Run manually
# (workflow_dispatch) or on a pull request touching packaging, it only uploads
# the bundles as workflow artifacts, so the pipeline can be exercised without
# publishing.
#
# Secrets live in the GitHub environment `release`, which only `v*` tags may deploy to, so
# no branch, pull request or manual run can sign with them (see docs/RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY           stable updater key (from `tauri signer generate`); the dev
#                                       channel (desktop-dev-channel.yml) has its own key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   ANDROID_KEYSTORE_BASE64             release keystore (`base64 -w0 labterm-release.jks`)
#   ANDROID_KEYSTORE_PASSWORD           its store/key password (alias `labterm`)
# Optional, same environment (macOS Developer ID signing + notarization; without them the .app is
# ad-hoc signed and users open it with `xattr -cr`, see docs/RELEASING.md):
#   APPLE_CERTIFICATE                   Developer ID Application .p12, base64
#   APPLE_CERTIFICATE_PASSWORD          its password
#   APPLE_SIGNING_IDENTITY              "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarytool credentials (app-specific password)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.macos.conf.json
      - apps/desktop/src-tauri/capabilities/**
      - apps/desktop/src-tauri/icons/**
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/package.json
      - apps/android/app/build.gradle.kts
      - apps/android/gradle.properties
      - apps/ios/project.yml
      - apps/ios/build-core.sh
      - apps/ios/altstore/**

# Tags and manual runs keep one group per ref and are never cancelled. Pull request runs only
# build unsigned bundles as artifacts, so a newer push to the PR cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "package.json=$pkg workspace=$ws ref=$GITHUB_REF_NAME"
          [ "$pkg" = "$ws" ] || { echo "::error::apps/desktop/package.json and Cargo.toml versions differ"; exit 1; }
          ios=$(sed -n 's/^    MARKETING_VERSION: "\(.*\)"/\1/p' apps/ios/project.yml | head -1)
          [ "$ios" = "$ws" ] || { echo "::error::apps/ios/project.yml MARKETING_VERSION ($ios) differs from Cargo.toml ($ws)"; exit 1; }
          # Store manifests and the Helm chart carry the version too.
          chart=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/labterm/Chart.yaml)
          snap=$(sed -n 's/^version: "\(.*\)"/\1/p' packaging/snap/snapcraft.yaml)
          scoop=$(node -p "require('./packaging/scoop/termoso.json').version")
          fdroid=$(sed -n 's/^CurrentVersion: \(.*\)/\1/p' packaging/fdroid/com.termoso.android.yml)
          flatpak=$(sed -n 's|.*/archive/refs/tags/v\(.*\)\.tar\.gz|\1|p' packaging/flatpak/dev.termoso.Termoso.yml)
          for pair in "deploy/helm/labterm/Chart.yaml=$chart" "packaging/snap/snapcraft.yaml=$snap" "packaging/scoop/termoso.json=$scoop" "packaging/fdroid/com.termoso.android.yml=$fdroid" "packaging/flatpak/dev.termoso.Termoso.yml=$flatpak"; do
            [ "${pair#*=}" = "$ws" ] || { echo "::error::${pair%%=*} carries version ${pair#*=}, Cargo.toml has $ws"; exit 1; }
          done
          # The version field alone is not enough: download URLs, the F-Droid
          # build list and the AppStream release list carry it too.
          grep -q "releases/download/v$ws/Labterm_${ws}_x64-setup.exe" packaging/scoop/termoso.json \
            || { echo "::error::packaging/scoop/termoso.json download URLs are not at $ws"; exit 1; }
          grep -q "^  - versionName: $ws\$" packaging/fdroid/com.termoso.android.yml \
            || { echo "::error::packaging/fdroid/com.termoso.android.yml has no Builds entry for $ws"; exit 1; }
          grep -q "<release version=\"$ws\"" packaging/flatpak/dev.termoso.Termoso.metainfo.xml \
            || { echo "::error::metainfo.xml has no <release> for $ws"; exit 1; }
          lic=$(sed -n 's/^license = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for f in packaging/snap/snapcraft.yaml packaging/scoop/termoso.json packaging/fdroid/com.termoso.android.yml packaging/flatpak/dev.termoso.Termoso.metainfo.xml; do
            grep -q "$lic" "$f" || { echo "::error::$f does not carry the $lic license"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$pkg" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $pkg"; exit 1; }
            # A release must carry Labterm's own updater key and feed: with upstream Termoso's
            # the app keeps its updater off (update.rs) and the feed would be Labterm's.
            conf=apps/desktop/src-tauri/tauri.conf.json
            key=$(jq -r '.plugins.updater.pubkey // ""' "$conf")
            [ -n "$key" ] || { echo "::error::$conf has no updater public key"; exit 1; }
            grep -q "\"$key\"" apps/desktop/src-tauri/src/update.rs && { echo "::error::$conf still has upstream Termoso's updater key"; exit 1; }
            jq -e --arg r "$GITHUB_REPOSITORY" '.plugins.updater.endpoints | all(contains("github.com/\($r)/"))' "$conf" > /dev/null \
              || { echo "::error::$conf updater endpoints are not this repository's releases"; exit 1; }
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
      # One draft per tag, created here before the platform matrix fans out.
      # Letting every bundle job create it on demand raced on v0.11.1: two
      # drafts appeared in the same second and the assets were split between them.
      - name: Create the draft release
        id: draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Labterm $GITHUB_REF_NAME" \
              -F draft=true -F prerelease=${{ contains(github.ref_name, '-') }} \
              -f body="Signed desktop builds of Labterm ${{ steps.v.outputs.version }}." --jq .id)
          fi
          echo "draft release id=$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: version
    # Dependabot PRs do not see repository secrets, so the signing step would
    # fail on an empty key; the CI workflow still builds the desktop there.
    if: github.actor != 'dependabot[bot]'
    # Signing secrets only on tags; other runs build without the environment and its keys.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64 (deb, rpm, AppImage)
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux-x86_64
          - name: linux aarch64 (deb, rpm, AppImage)
            os: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
            artifact: linux-aarch64
          - name: windows x86_64 (msi, nsis)
            os: windows-latest
            bundles: msi,nsis
            artifact: windows-x86_64
          # Cross-compiled on the x86_64 runner: the MSVC toolchain targets
          # ARM64 natively and both WiX and NSIS produce arm64 installers.
          - name: windows aarch64 (msi, nsis)
            os: windows-latest
            bundles: msi,nsis
            target: aarch64-pc-windows-msvc
            artifact: windows-aarch64
          # Two separate dmgs (Apple Silicon + Intel) rather than one universal
          # binary: half the download, and the updater picks the right one.
          - name: macos (dmg, Apple Silicon)
            os: macos-latest
            bundles: app,dmg
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: macos (dmg, Intel)
            os: macos-latest
            bundles: app,dmg
            target: x86_64-apple-darwin
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libudev-dev libssl-dev patchelf file xdg-utils

      # Pre-seeds ~/.cache/tauri with Labterm's linuxdeploy `appimage` output
      # plugin, which strips the bundled libwayland before packing.
      - name: Labterm linuxdeploy appimage plugin
        if: runner.os == 'Linux'
        run: apps/desktop/src-tauri/appimage/prepare.sh

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.artifact }}
          # A PR's cache only serves that PR and evicts main's.
          save-if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop

      # Tauri reads the APPLE_* variables only when they are set, and an empty
      # APPLE_SIGNING_IDENTITY would override the ad-hoc identity from
      # tauri.macos.conf.json, so export them only when the secrets exist.
      - name: Apple signing credentials (when configured)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_env() {
            # heredoc form: a base64 .p12 may span several lines
            for v in "$@"; do
              printf '%s<<__LABTERM_EOF__\n%s\n__LABTERM_EOF__\n' "$v" "${!v}" >> "$GITHUB_ENV"
            done
          }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            export_env APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              export_env APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              echo "Developer ID signing + notarization"
            else
              echo "Developer ID signing, no notarization"
            fi
          else
            echo "No Apple certificate: ad-hoc signature (users run xattr -cr once)"
          fi

      # Forks and outside pull requests get no secrets, and Tauri refuses to
      # build updater artifacts without the key. Like the unsigned Android APKs,
      # such runs still build every bundle, just without the updater .sig files.
      # A tag never takes this path, so a release without the key still fails.
      - name: Updater signing key (skip updater artifacts when absent)
        id: updater
        if: github.ref_type != 'tag'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # A file rather than inline JSON: tauri-action splits args and would eat the quotes.
            cfg="$RUNNER_TEMP/no-updater-artifacts.json"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$cfg"
            echo "args=--config $cfg" >> "$GITHUB_OUTPUT"
            echo "No updater key: building bundles without updater signatures"
          fi

      - name: Build, sign and (on tags) publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ steps.updater.outputs.args }}
          # Only publish from a tag; a manual run just produces artifacts below.
          releaseId: ${{ github.ref_type == 'tag' && needs.version.outputs.release_id || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Labterm {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            Signed desktop builds of Labterm ${{ needs.version.outputs.version }}, built from commit
            `${{ github.sha }}` (Settings → About shows the same commit).

            Verify a download: `sha256sum -c SHA256SUMS.txt --ignore-missing`, then
            `gh attestation verify <file> -R ${{ github.repository }}` (see docs/RELEASING.md).

            Every installer ships with a minisign `.sig`; the app verifies it against the
            public key compiled into the binary before installing an update. `latest.json`
            is the updater manifest — mirror it (and the assets) on your own server to keep
            update checks fully self-hosted; see docs/RELEASING.md.

            Linux: `_amd64` / `.x86_64` bundles are for x86_64, `_arm64` / `_aarch64` / `.aarch64`
            for 64-bit ARM (Raspberry Pi 4+, Apple Silicon VMs, Ampere and friends).

            Windows: `_x64` installers are for x86_64, `_arm64` for Windows on ARM
            (Snapdragon X, Surface Pro X and friends).

            macOS: `_aarch64.dmg` is for Apple Silicon, `_x64.dmg` for Intel. Unless this
            repository has a Developer ID configured, the builds are ad-hoc signed and not
            notarized: after dragging Labterm to Applications run
            `xattr -cr /Applications/Labterm.app` once (or right-click → Open) — see
            docs/RELEASING.md.

      - name: Verify AppImage contents
        if: runner.os == 'Linux'
        run: |
          for f in target/release/bundle/appimage/*.AppImage; do
            apps/desktop/src-tauri/appimage/verify.sh "$f"
          done

      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: labterm-desktop-${{ needs.version.outputs.version }}-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/*/release/bundle/msi/*.msi
            target/*/release/bundle/msi/*.msi.sig
            target/*/release/bundle/nsis/*.exe
            target/*/release/bundle/nsis/*.exe.sig
            target/*/release/bundle/dmg/*.dmg
            target/*/release/bundle/macos/*.app.tar.gz
            target/*/release/bundle/macos/*.app.tar.gz.sig

  android:
    name: android (signed APKs)
    needs: version
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-release
          # A PR's cache only serves that PR and evicts main's.
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      # The embedded NetBird client (crates/labterm-netbird/go) is a Go library in the APK.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: crates/labterm-netbird/go/go.mod
          cache-dependency-path: crates/labterm-netbird/go/go.sum
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Release keystore from secrets
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labterm-release.jks"
          echo "LABTERM_ANDROID_KEYSTORE=$RUNNER_TEMP/labterm-release.jks" >> "$GITHUB_ENV"

      # arm64 + armv7 for devices, x86_64 for emulators; one APK per ABI plus a universal one.
      # Without the keystore (manual / PR run) Gradle leaves the APKs unsigned.
      - name: Build
        run: |
          ./gradlew --no-daemon -Plabterm.abis=arm64-v8a,armeabi-v7a,x86_64 -Plabterm.splits=true :app:assembleRelease
          v=${{ needs.version.outputs.version }}
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)              # app-arm64-v8a-release[-unsigned]
            abi=${b#app-}; abi=${abi%-release*}
            cp "$f" "out/labterm-${v}-${abi}.apk"
          done
          ls -l out
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          LABTERM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LABTERM_ANDROID_KEY_ALIAS: labterm

      - name: Verify signatures
        if: github.ref_type == 'tag'
        run: |
          for f in out/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$f" | grep -E 'Signer #1 certificate SHA-256'
          done
        working-directory: apps/android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: labterm-android-${{ needs.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: apps/android/out/*.apk

  # Unsigned device build. There is deliberately no Apple identity here: a
  # free Apple ID can only sign on the user's own device/Mac (7-day profile),
  # which AltStore/SideStore do from the source JSON published next to the .ipa.
  ios:
    name: ios (unsigned .ipa for sideloading)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios-release
          # A PR's cache only serves that PR and evicts main's.
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: brew install xcodegen
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Rust core (device, release) + Swift bindings + xcframework
        run: ./build-core.sh --release --device --no-sim
        working-directory: apps/ios
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project Labterm.xcodeproj -scheme Labterm -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Labterm.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            | tee "$RUNNER_TEMP/archive.log" | grep -E 'error:|warning:|\*\*' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$RUNNER_TEMP/archive.log"
        working-directory: apps/ios
      - name: Package .ipa
        run: |
          v=${{ needs.version.outputs.version }}
          app="$RUNNER_TEMP/Labterm.xcarchive/Products/Applications/Labterm.app"
          test -d "$app" || { echo "::error::no Labterm.app in the archive"; ls -R "$RUNNER_TEMP/Labterm.xcarchive"; exit 1; }
          plutil -p "$app/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion'
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$v" ] || { echo "::error::app version differs from $v"; exit 1; }
          lipo -info "$app/Labterm" | grep -q arm64
          test -d "$app/Frameworks" && ls "$app/Frameworks" || echo "(no embedded frameworks: Rust core is statically linked)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/apps/ios/out/labterm-$v-ios.ipa" Payload)
          ls -l out
          unzip -l "out/labterm-$v-ios.ipa" | tail -3
        working-directory: apps/ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: labterm-ios-${{ needs.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: apps/ios/out/*.ipa

  publish:
    name: checksums, SBOM, attestations + publish
    if: github.ref_type == 'tag'
    needs: [version, bundle, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - name: Locate the draft release
        id: rel
        run: |
          id="${{ needs.version.outputs.release_id }}"
          [ -n "$id" ] || id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          [ -n "$id" ] || { echo "::error::no release for $GITHUB_REF_NAME"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: labterm-android-${{ needs.version.outputs.version }}
          path: android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: labterm-ios-${{ needs.version.outputs.version }}
          path: ios
      - name: Upload APKs to the draft release
        run: |
          for f in android/*.apk; do
            gh api --method POST -H 'Content-Type: application/vnd.android.package-archive' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=$(basename "$f")" \
              --input "$f" > /dev/null
          done
      # The AltStore/SideStore source is regenerated for every release and
      # always fetched through releases/latest/download/, so the URL users add
      # once stays valid (docs/IOS_SIDELOAD.md).
      - name: Upload .ipa + AltStore source to the draft release
        run: |
          v=${{ needs.version.outputs.version }}
          ipa=ios/labterm-$v-ios.ipa
          test -f "$ipa"
          python3 src/apps/ios/altstore/render.py \
            --template src/apps/ios/altstore/source.template.json \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --version "$v" \
            --ipa "$ipa" --out labterm-altstore.json
          python3 -m json.tool labterm-altstore.json | head -40
          gh api --method POST -H 'Content-Type: application/octet-stream' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=$(basename "$ipa")" \
            --input "$ipa" > /dev/null
          gh api --method POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=labterm-altstore.json" \
            --input labterm-altstore.json > /dev/null
      - name: Download and verify assets
        run: |
          mkdir assets && cd assets
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?per_page=100" \
            --jq '.[] | "\(.id) \(.name)"' > ../assets.txt
          while read -r aid name; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$name"
          done < ../assets.txt
          ls -l
          test -f latest.json
          for f in *_amd64.deb *_arm64.deb *.x86_64.rpm *.aarch64.rpm *_amd64.AppImage *_aarch64.AppImage \
                   *.msi *.exe *.apk *_aarch64.dmg *_x64.dmg *_aarch64.app.tar.gz *_x64.app.tar.gz; do
            [ -e "$f" ] || { echo "::error::missing bundle $f"; exit 1; }
          done
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            [ -e "labterm-${{ needs.version.outputs.version }}-$abi.apk" ] || { echo "::error::missing APK for $abi"; exit 1; }
          done
          test -f "labterm-${{ needs.version.outputs.version }}-ios.ipa" || { echo "::error::missing iOS .ipa"; exit 1; }
          test -f labterm-altstore.json || { echo "::error::missing labterm-altstore.json"; exit 1; }
          jq -e --arg v "${{ needs.version.outputs.version }}" '.apps[0].versions[0] | select(.version == $v) | .downloadURL, .sha256' labterm-altstore.json
          [ "$(jq -r '.apps[0].versions[0].sha256' labterm-altstore.json)" = "$(sha256sum "labterm-${{ needs.version.outputs.version }}-ios.ipa" | cut -d' ' -f1)" ] || { echo "::error::altstore sha256 does not match the uploaded .ipa"; exit 1; }
          for f in *.AppImage *.msi *.exe *.app.tar.gz; do
            [ -e "$f.sig" ] || { echo "::error::missing signature for $f"; exit 1; }
          done
      # The five bundle jobs each read-modify-write latest.json through
      # tauri-action, so a concurrent upload can drop a platform. Rebuild the
      # manifest from the signed assets that actually made it to the release.
      - name: Rebuild latest.json from the uploaded assets
        run: |
          cd assets
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platform_keys() {
            case "$1" in
              *_amd64.AppImage)     echo linux-x86_64 linux-x86_64-appimage ;;
              *_aarch64.AppImage)   echo linux-aarch64 linux-aarch64-appimage ;;
              *_amd64.deb)          echo linux-x86_64-deb ;;
              *_arm64.deb)          echo linux-aarch64-deb ;;
              *.x86_64.rpm)         echo linux-x86_64-rpm ;;
              *.aarch64.rpm)        echo linux-aarch64-rpm ;;
              *_x64-setup.exe)      echo windows-x86_64 windows-x86_64-nsis ;;
              *_x64_*.msi)          echo windows-x86_64-msi ;;
              *_arm64-setup.exe)    echo windows-aarch64 windows-aarch64-nsis ;;
              *_arm64_*.msi)        echo windows-aarch64-msi ;;
              *_aarch64.app.tar.gz) echo darwin-aarch64 darwin-aarch64-app ;;
              *_x64.app.tar.gz)     echo darwin-x86_64 darwin-x86_64-app ;;
            esac
          }
          jq '{version, notes, pub_date, platforms: {}}' latest.json > ../latest.json
          for sig in *.sig; do
            f=${sig%.sig}
            for key in $(platform_keys "$f"); do
              jq --arg k "$key" --arg url "$base/$f" --rawfile sig "$sig" \
                '.platforms[$k] = {signature: $sig, url: $url}' ../latest.json > ../latest.tmp
              mv ../latest.tmp ../latest.json
            done
          done
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64; do
            jq -e --arg p "$p" '.platforms[$p].url' ../latest.json > /dev/null || { echo "::error::latest.json lacks $p"; exit 1; }
          done
          jq '.platforms | map_values(.url)' ../latest.json
          mv ../latest.json latest.json
          old=$(awk '$2 == "latest.json" {print $1}' ../assets.txt)
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          gh api --method POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=latest.json" \
            --input latest.json > /dev/null
      # Supply chain: an SBOM of the source tree (every Cargo, npm and Gradle
      # dependency the release was built from) in SPDX and CycloneDX, GitHub
      # build-provenance attestations for every asset, and a keyless cosign
      # signature over SHA256SUMS.txt. SECURITY.md explains how to verify.
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: src
          format: spdx-json
          output-file: assets/labterm-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: src
          format: cyclonedx-json
          output-file: assets/labterm-${{ needs.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOMs
        run: |
          cd assets
          for f in *.spdx.json *.cdx.json; do
            gh api --method POST -H 'Content-Type: application/json' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=$f" \
              --input "$f" > /dev/null
          done
      - name: Write SHA256SUMS
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api --method POST -H 'Content-Type: text/plain' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=SHA256SUMS.txt" \
            --input SHA256SUMS.txt > /dev/null
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign SHA256SUMS (cosign keyless)
        run: |
          cd assets
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
          gh api --method POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=SHA256SUMS.txt.sigstore.json" \
            --input SHA256SUMS.txt.sigstore.json > /dev/null
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*
            !assets/*.sig
            !assets/*.sigstore.json
            !assets/latest.json
            !assets/labterm-altstore.json
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in *-*) latest=false ;; *) latest=true ;; esac
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}" \
            -F draft=false -f make_latest=$latest > /dev/null
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

  # Off in Labterm: every target below (termoso/termoso-repo, termoso/homebrew-termoso, the
  # Labterm.Labterm winget package) is upstream Termoso's. TODO: point it at Labterm's own
  # channels, then turn it back on.
  # Package channels: the apt/dnf repositories served from termoso/termoso-repo
  # (GitHub Pages), the Homebrew tap termoso/homebrew-termoso and the winget
  # manifest in microsoft/winget-pkgs. Stable tags only; pre-releases stay on
  # the releases page. Pushes to the two side repositories use write-only
  # deploy keys, so this job never needs a token for the main repository.
  distribute:
    name: apt/dnf repo, Homebrew tap, winget
    if: false
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/repo
          path: src
      - name: Download the published bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D assets \
            -p '*.deb' -p '*.rpm' -p 'SHA256SUMS.txt'
          ls -l assets
      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends createrepo-c rpm apt-utils
      - name: Import the repository signing key
        env:
          REPO_GPG_KEY: ${{ secrets.TERMOSO_REPO_GPG_KEY }}
        run: |
          printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --quiet --import
          gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}' > keyid
          test -s keyid
      - name: Check out labterm-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termoso/termoso-repo
          ssh-key: ${{ secrets.TERMOSO_REPO_DEPLOY_KEY }}
          path: repo
      - name: Rebuild the apt + dnf repositories
        run: |
          src/scripts/repo/build.sh assets repo "$VERSION" "$(cat keyid)"
          cd repo
          git config user.name "Labterm release"
          git config user.email "packages@termoso.dev"
          git add -A
          git commit -q -m "Labterm $VERSION"
          git push -q
      - name: Check out the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termoso/homebrew-termoso
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the cask
        run: |
          mkdir -p tap/Casks
          src/scripts/repo/cask.sh assets/SHA256SUMS.txt "$VERSION" > tap/Casks/labterm.rb
          cd tap
          git config user.name "Labterm release"
          git config user.email "packages@termoso.dev"
          git add -A
          git commit -q -m "labterm $VERSION" || echo "cask unchanged"
          git push -q
      # Opens the version-bump PR in microsoft/winget-pkgs from a fork owned by
      # the token's account (WINGET_TOKEN needs public_repo). The first
      # submission of a new package is manual (`komac new`), so this only runs
      # once the package exists upstream. Failures here must not fail the release.
      - name: Submit the winget update
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          curl -fsSL -o komac.tgz https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz
          tar xzf komac.tgz
          ./komac update Labterm.Labterm --version "$VERSION" --submit --token "$WINGET_TOKEN" \
            --urls "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Labterm_${VERSION}_x64_en-US.msi"
