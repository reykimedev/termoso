# Security advisories for the dependencies: RustSec (cargo deny) and the npm advisory database for
# both JS trees. A new advisory can appear any day without a commit, so this runs on its own: daily
# on main, and on pull requests that change a lockfile. It is not part of ci.yml, so it never
# blocks a PR's other checks or a devel build. Gradle is covered by the dependency graph that
# dependency-graph.yml submits (Dependabot alerts). Licenses, bans and sources stay in ci.yml.
name: Advisories

on:
  schedule:
    - cron: "23 5 * * *"
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - web/package-lock.json
      - apps/desktop/package-lock.json
      - .github/workflows/advisories.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  npm:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [web, apps/desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate
        working-directory: ${{ matrix.dir }}
