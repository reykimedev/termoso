# Takes the Android pictures for docs/screenshots (android-*.png) on an emulator with example
# data, and pushes them to the branch "<branch>-android-shots" for review. Nothing is committed
# to the branch that ran it: copy the pictures over once they look right.
# See scripts/screenshots/README.md.
name: screenshots-android

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/screenshots/android.sh
      - scripts/screenshots/android/**
      - .github/workflows/screenshots-android.yml

concurrency:
  group: screenshots-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: android screenshots (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # pushes the pictures to "<branch>-android-shots"
    env:
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          shared-key: android-shots
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 emulator ${{ env.SYSTEM_IMAGE }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: crates/labterm-netbird/go/go.mod
          cache-dependency-path: crates/labterm-netbird/go/go.sum
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # A release build looks like the shipped app (no "Debug" name). It is signed with a key
      # made here and thrown away: this APK only ever runs on this emulator.
      - name: Build the app (x86_64, release)
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          LABTERM_ANDROID_KEYSTORE: ${{ runner.temp }}/shots.jks
          LABTERM_ANDROID_KEYSTORE_PASSWORD: screenshots-only
          LABTERM_ANDROID_KEY_ALIAS: shots
        run: |
          keytool -genkeypair -keystore "$LABTERM_ANDROID_KEYSTORE" -storepass "$LABTERM_ANDROID_KEYSTORE_PASSWORD" \
            -alias shots -keyalg EC -validity 1 -dname "CN=screenshots"
          ./gradlew --no-daemon -Plabterm.abis=x86_64 :app:assembleRelease
          ls app/build/outputs/apk/release/

      - name: Start the test SSH server
        run: |
          docker build -t shots-sshd scripts/screenshots/android/sshd
          docker run -d --name shots-sshd --hostname web-01 -p 2222:22 shots-sshd

      - name: Start the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n shots -k "$SYSTEM_IMAGE" -d pixel_7 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd shots -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell wm size

      - name: Take the pictures
        id: shots
        continue-on-error: true
        run: |
          pip install --quiet pillow
          apk=$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)
          scripts/screenshots/android.sh "$apk" "$RUNNER_TEMP/shots"

      - name: Push the pictures to <branch>-android-shots
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/shots"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898299+github-actions[bot]@users.noreply.github.com"
          tmp="$RUNNER_TEMP/push" && mkdir -p "$tmp" && cd "$tmp" && git init -q -b shots
          cp -r "$out"/. .
          cp "$RUNNER_TEMP/emulator.log" . || true
          docker logs shots-sshd > sshd.log 2>&1 || true
          git add -A && git commit -qm "Android pictures from $SHA"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "shots:refs/heads/${BRANCH}-android-shots"

      - name: Fail when a picture failed
        if: steps.shots.outcome != 'success'
        run: exit 1
