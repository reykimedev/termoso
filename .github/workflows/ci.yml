name: CI

on:
  # Pushes to main run this workflow as the first stage of devel.yml, and `v*` tags as the first
  # stage of release.yml; both build and publish only after it passes.
  workflow_call:
  pull_request:
    # ready_for_review starts the heavy jobs that were skipped while the PR was a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly full run on main: the platform jobs that pushes to main skip run here.
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

# A new push to a pull request cancels that PR's older queued or running CI, so scarce runners
# go to the latest commit. Everything else gets a group of its own per run and is never cancelled:
# tags, nightly and manual runs, and each devel.yml call for a push to main (every commit gets its
# devel release, and finished jobs save their caches).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Decides which jobs run. Jobs are skipped with `if:` rather than a workflow-level `paths`
  # filter, because a skipped job satisfies a required check and a workflow that never started
  # leaves it pending. `check` (fmt + clippy) always runs except on a quiet night.
  # - Pull requests: each job only when its paths changed. Shared Rust code and this workflow
  #   count for every Rust job. The heavy jobs (android, netbird, fuzz, image builds) also wait
  #   until the PR is ready for review.
  # - Pushes to main (devel.yml): the light jobs; the heavy ones already ran on the PR, and the
  #   images and the android build are built by devel.yml itself.
  # - Releases (release.yml, on tags and by hand): everything except android, which release.yml
  #   builds itself.
  # - Nightly: the heavy jobs, unless main has had no commit for a day; then nothing at all.
  # - Manual runs of this workflow: everything.
  # macOS and iOS are off for now (Mike, 2026-11-26); their jobs stay below with `if: false`.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
      rust: ${{ steps.filter.outputs.rust }}
      opkssh: ${{ steps.filter.outputs.opkssh }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      labterm_web: ${{ steps.filter.outputs.labterm_web }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      supply_chain: ${{ steps.filter.outputs.supply_chain }}
      web_images: ${{ steps.filter.outputs.web_images }}
      android: ${{ steps.filter.outputs.android }}
      netbird: ${{ steps.filter.outputs.netbird }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      docker: ${{ steps.filter.outputs.docker }}
      docker_backup: ${{ steps.filter.outputs.docker_backup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its first parent: the PR base, or main before the merge.
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          # In a called workflow this is the caller's name.
          WORKFLOW: ${{ github.workflow }}
        run: |
          light="rust opkssh web desktop labterm_web kubernetes supply_chain"
          heavy="web_images android netbird fuzz docker docker_backup"
          set_to() { v=$1; shift; for j in "$@"; do echo "$j=$v" >> "$GITHUB_OUTPUT"; done; }
          shared='^(crates/|Cargo\.(toml|lock)$|rust-toolchain|\.cargo/|\.github/workflows/ci\.yml$|\.github/actions/)'
          ci='^\.github/workflows/ci\.yml$'
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          if [ "$WORKFLOW" = "Desktop release" ]; then
            set_to true run $light netbird fuzz; set_to false web_images android docker docker_backup; exit 0
          fi
          case "$EVENT" in
            pull_request)
              set_to true run
              files=$(git diff --name-only HEAD^1 HEAD); printf 'Changed files:\n%s\n' "$files"
              {
                echo "rust=$(has "$shared|^apps/desktop/src-tauri/")"
                echo "opkssh=$(has "$shared")"
                echo "web=$(has "$shared|^web/")"
                echo "desktop=$(has "$ci|^apps/desktop/|^crates/labterm-core/assets/")"
                echo "labterm_web=$(has "$shared|^apps/web/|^apps/desktop/")"
                echo "kubernetes=$(has "$ci|^deploy/web/")"
                echo "supply_chain=$(has "$ci|(^|/)Cargo\.(toml|lock)$|^deny\.toml$")"
              } | tee -a "$GITHUB_OUTPUT"
              if [ "$DRAFT" = true ]; then
                echo "Draft PR: heavy jobs skipped until it is ready for review."; set_to false $heavy; exit 0
              fi
              {
                echo "web_images=$(has "$shared|^apps/web/|^apps/desktop/|^deploy/web/")"
                echo "android=$(has "$shared|^apps/android/")"
                echo "netbird=$(has "$shared")"
                echo "fuzz=$(has "$shared|^fuzz/")"
                echo "docker=$(has "$shared|^apps/desktop/src-tauri/|^web/|^deploy/Dockerfile|^\.dockerignore$")"
                # backup's build stage is the server's; only its own Dockerfile adds anything.
                echo "docker_backup=$(has "$ci|^deploy/Dockerfile\.backup$|^\.dockerignore$")"
              } | tee -a "$GITHUB_OUTPUT" ;;
            push)
              set_to true run $light; set_to false $heavy ;;
            schedule)
              if [ $(( $(date +%s) - $(git log -1 --format=%ct HEAD) )) -gt 90000 ]; then
                echo "No commit on main for a day: nightly run skipped."
                set_to false run $light $heavy
              else
                # Images are built and published by devel.yml.
                set_to false $light web_images docker docker_backup; set_to true run android netbird fuzz
              fi ;;
            *) set_to true run $light $heavy ;;
          esac

  # Lint stage. Every build and test job below needs it, so a lint failure never starts a build.
  # fmt runs first and fails within a minute; clippy follows.
  check:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: tests (postgres + redis + rustfs + mailpit)
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: labterm
          POSTGRES_PASSWORD: labterm
          POSTGRES_DB: labterm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labterm -d labterm"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LABTERM_TEST_DATABASE_URL: postgres://labterm:labterm@localhost:5432/labterm
      LABTERM_TEST_REDIS_URL: redis://127.0.0.1:6379
      LABTERM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      LABTERM_TEST_SMTP_ADDR: 127.0.0.1:1025
      LABTERM_TEST_MAILPIT_URL: http://127.0.0.1:8025
      LABTERM_TEST_REQUIRE_SERVICES: "1"
      LABTERM_TEST_REQUIRE_MOSH: "1"
      # backup/restore round trip needs pg_dump of the server's major version.
      LABTERM_TEST_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      LABTERM_TEST_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
      # Line tables keep file:line in panics and backtraces but drop the variable info, which
      # shrinks target/ and the time spent writing and linking the ~40 test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deleting these takes about 3 minutes, so it runs in the background while the next steps
      # install tools and cargo starts compiling; the space is only needed late in the build.
      - name: Free runner disk in the background (cargo test --workspace fills the 14 GB root volume)
        run: |
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift' > /dev/null 2>&1 &
          # In the foreground: it must finish before RustFS's image is pulled below.
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /
      - name: Tauri system libraries + mosh-server (Mosh interop tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev mosh
      - name: PostgreSQL 18 client (pg_dump/pg_restore for the backup tests)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Start RustFS (S3-compatible storage for session-log tests)
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin -e RUSTFS_SECRET_KEY=minioadmin \
            rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/health && break
            sleep 1
          done
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - if: always()
        run: df -h / target

  opkssh:
    name: opkssh certificates (e2e against opkssh verify + wasm32)
    needs: [changes, check]
    if: needs.changes.outputs.opkssh == 'true'
    runs-on: ubuntu-latest
    env:
      LABTERM_OPKSSH_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test OpenID provider + OpenSSH host with opkssh
        run: docker compose -f crates/labterm-client/tests/opkssh/compose.yml up -d --build --wait
      - name: System libraries (USB HID for the fido2 feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p labterm-oidc-cert
      - run: cargo test --locked -p labterm-client --features oidc-cert --test opkssh_e2e
      # The crate also has to build for the browser (future web client).
      - run: cargo check --locked -p labterm-oidc-cert --target wasm32-unknown-unknown --no-default-features --features http
      - if: failure()
        run: docker compose -f crates/labterm-client/tests/opkssh/compose.yml logs

  web:
    name: web cabinet (wasm + typecheck + lint + build)
    needs: [changes, check]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: wasm
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run wasm
      - run: npm run format:check
      - run: node ../scripts/i18n-extract.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  desktop:
    name: desktop webview (typecheck + lint + build)
    needs: [changes, check]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Labterm Web (apps/web): the desktop frontend built for the browser, with SSH in wasm.
  # The relay's tests run in `test`, its clippy in `check`.
  labterm-web:
    name: labterm web (wasm32 clippy + build)
    needs: [changes, check]
    if: needs.changes.outputs.labterm_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: labterm-web-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # build.sh installs the desktop frontend's dependencies from this lockfile.
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo clippy -p labterm-web-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - name: wasm-bindgen at the version in Cargo.lock
        run: |
          v="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $v" || cargo install wasm-bindgen-cli --locked --version "$v"
      - run: ./apps/web/build.sh

  labterm-web-kubernetes:
    name: labterm web (kubernetes manifests)
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: kubectl kustomize deploy/web/kubernetes > /tmp/labterm-web.yaml
      - env:
          # Schemas for the cert-manager and Traefik resources.
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: >-
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          -strict -summary -schema-location default -schema-location "$CRDS"
          /tmp/labterm-web.yaml

  # Pull requests build both images; devel.yml publishes them from main (web-images.yml). Like
  # `docker`, the matrix always runs on a PR and only its steps skip, so required checks report.
  labterm-web-images:
    name: labterm web image (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    needs: [changes, check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [relay, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.web_images == 'true'
      - if: needs.changes.outputs.web_images == 'true'
        run: docker build -f deploy/web/Dockerfile --target ${{ matrix.target }} -t labterm-${{ matrix.target }}:ci .

  # Everything else runs on Linux, so this is what catches a broken
  # `cfg(target_os = "macos")` branch or a bundle setting the macOS bundler
  # rejects. The debug .app is ad-hoc signed exactly like a release without
  # Apple secrets (docs/RELEASING.md), then actually launched: the runner has
  # a GUI session, so apps/desktop/smoke drives welcome → hosts → local zsh →
  # settings inside the real WKWebView and screenshots the window.
  macos:
    name: macos (clippy + core tests + tauri build --debug + runtime smoke)
    needs: [changes, check]
    # Off for now (Mike, 2026-11-26): macOS runners rarely start. To turn it back on, add a
    # `macos` output to `changes` (apps/desktop/ and this workflow; true nightly) and use it here.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: macos
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - run: cargo clippy -p labterm-core -p labterm-desktop --all-targets --locked
      - run: cargo test -p labterm-core --locked
      # The embedded VPN client goes into Contents/Frameworks (tauri.macos.conf.json).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: crates/labterm-netbird/go/go.mod
          cache-dependency-path: crates/labterm-netbird/go/go.sum
      - run: apps/desktop/src-tauri/vpn/build.sh
      # No updater key on CI: build the .app only, skip the signed updater tarball.
      - run: npm run tauri build -- --debug --bundles app --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: apps/desktop
      - name: Inspect the bundle
        run: |
          app=target/debug/bundle/macos/Labterm.app
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test -x "$exe" || { echo "::error::no executable at $exe"; ls -R "$app"; exit 1; }
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|LSMinimumSystemVersion|CFBundleURLSchemes'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Signature)'
          lipo -info "$exe"
          test -f "$app/Contents/Frameworks/liblabterm_netbird.dylib" || { echo "::error::no VPN client in the bundle"; exit 1; }
      - name: Runtime smoke
        run: apps/desktop/smoke/macos.sh target/debug/bundle/macos/Labterm.app "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-smoke
          path: |
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/report.txt
            ${{ runner.temp }}/smoke/app.log
          if-no-files-found: ignore
          retention-days: 14

  # SwiftUI client over the same Rust core (UniFFI Swift). The simulator slice
  # is enough to compile, run XCTest against the real core and drive the UI
  # smoke (XCUITest) — screenshots and the .xcresult are uploaded.
  ios:
    name: ios (rust sim core + uniffi swift + xcodebuild + XCTest/XCUITest)
    needs: [changes, check]
    # Off for now, like macos. Its paths were apps/ios/, crates/labterm-mobile/ and this workflow.
    if: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ios
      - run: brew install xcodegen
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - run: xcodebuild -version && xcodegen --version
      - name: Rust core (simulator) + Swift bindings + xcframework
        run: ./build-core.sh --debug --sim --no-device
        working-directory: apps/ios
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          picks=[(rt,dev) for rt,devs in d.items() if "iOS" in rt for dev in devs if dev["name"].startswith("iPhone")]
          picks.sort(key=lambda p:(p[0],p[1]["name"]))
          print(picks[-1][1]["udid"])')
          xcrun simctl boot "$udid" || true
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Labterm.xcodeproj -scheme Labterm \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" | tee "$RUNNER_TEMP/build.log" | grep -E 'error:|warning:|\*\*' || true
          grep -q '\*\* TEST BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"
        working-directory: apps/ios
      - name: XCTest + XCUITest (simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Labterm.xcodeproj -scheme Labterm \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/Labterm.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            | tee "$RUNNER_TEMP/test.log" | grep -E 'Test Case|Test Suite|error|failed|passed|\*\*' || true
          grep -q '\*\* TEST EXECUTE SUCCEEDED \*\*' "$RUNNER_TEMP/test.log"
        working-directory: apps/ios
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Labterm.xcresult" --output-path "$RUNNER_TEMP/screens" || true
          ls -la "$RUNNER_TEMP/screens" || true
          # Give the PNGs their test-assigned names when the manifest is present.
          python3 - "$RUNNER_TEMP/screens" <<'EOF' || true
          import json, os, sys
          d = sys.argv[1]
          m = os.path.join(d, "manifest.json")
          if os.path.exists(m):
              for entry in json.load(open(m)):
                  for a in entry.get("attachments", []):
                      src = os.path.join(d, a["exportedFileName"])
                      dst = os.path.join(d, a.get("suggestedHumanReadableName") or a["exportedFileName"])
                      if os.path.exists(src) and src != dst:
                          os.replace(src, dst)
          EOF
          (cd "$RUNNER_TEMP" && zip -qr Labterm.xcresult.zip Labterm.xcresult) || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/Labterm.xcresult.zip
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: android (cargo-ndk + gradle assembleDebug + lint)
    needs: [changes, check]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Shared with the debug channel's publish job (same RUSTFLAGS, same target).
          shared-key: android
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      # The embedded NetBird client (crates/labterm-netbird/go) is a Go library in the APK.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: crates/labterm-netbird/go/go.mod
          cache-dependency-path: crates/labterm-netbird/go/go.sum
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Rust for one ABI is enough to compile, lint and generate the bindings.
      - run: ./gradlew --no-daemon -Plabterm.abis=arm64-v8a :app:assembleDebug :app:lint
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: labterm-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # Embedded NetBird client against a real NetBird server (management, signal and relay
  # built from the same release), a far-end peer and the Rust crate, all on loopback.
  netbird:
    name: netbird (embedded client e2e)
    needs: [changes, check]
    if: needs.changes.outputs.netbird == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: netbird
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: crates/labterm-netbird/go/go.mod
          cache-dependency-path: crates/labterm-netbird/go/go.sum
      - run: cd crates/labterm-netbird/go && go vet ./...
      - run: crates/labterm-netbird/tests/e2e.sh

  # Supply chain: license allow-list, banned crates and registry sources for the whole workspace
  # (deny.toml), when a manifest or the lockfile changes. These depend only on the commit.
  # Advisories (RustSec, npm) change without a commit, so they run daily in advisories.yml and
  # never block a PR or a devel build.
  supply-chain:
    name: supply chain (cargo deny bans + licenses + sources)
    needs: changes
    if: needs.changes.outputs.supply_chain == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check bans licenses sources

  # Untrusted-input parsers (SAML, WebDAV, terminal, key import, deep links)
  # must keep compiling against the crates they cover; a short run of each
  # target catches shallow panics early. Long campaigns are run by hand.
  fuzz:
    name: fuzz targets (nightly check + smoke)
    needs: [changes, check]
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      FUZZ_TOOLCHAIN: nightly-2026-10-31
      # The prebuilt cargo-fuzz binary is musl-static and defaults to its own
      # build triple; pin the target so the targets link against the host glibc std.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      # Pinned: the 2026-11-01 nightly fails on zvariant_utils (E0391 async-drop cycle);
      # move the date forward once rustc is fixed.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          components: rust-src
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz
      - run: cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz check --target "$FUZZ_TARGET"
        working-directory: fuzz
      - run: cargo +${{ env.FUZZ_TOOLCHAIN }} run --example seed
        working-directory: fuzz
      - name: smoke each target
        working-directory: fuzz
        run: |
          for t in $(cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz list); do
            cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz run --target "$FUZZ_TARGET" "$t" -- -max_total_time=20 -max_len=16384 -timeout=10 -rss_limit_mb=2048
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Build check for the server images on pull requests. Pushes to main and tags build and publish
  # them in server-images.yml. A skipped matrix job reports under its unexpanded name, which would
  # leave per-image required checks pending, so on a PR the matrix always runs and only its steps
  # skip when no image input changed. PRs build amd64 only; arm64 is built on main (devel.yml),
  # and its legs stay here, empty, so their check names keep reporting. The backup image builds
  # only when deploy/Dockerfile.backup changed: its Rust build stage is the server's.
  docker:
    name: docker image (${{ matrix.image }}, ${{ matrix.arch }})
    # test and web may be skipped when their paths did not change; the matrix must still run.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.check.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ matrix.runner }}
    needs: [changes, check, test, web]
    permissions:
      contents: read
    env:
      BUILD: ${{ needs.changes.outputs.docker == 'true' && matrix.arch == 'amd64' && (matrix.image != 'backup' || needs.changes.outputs.docker_backup == 'true') }}
      # Same Rust cache key as server-images.yml, so the binaries build on main's warm cache.
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        image: [server, bridge, backup]
        arch: [amd64, arm64]
        include:
          # 22.04: glibc 2.35, older than the images' bookworm (2.36).
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'
      - uses: ./.github/actions/server-prebuilt
        if: env.BUILD == 'true'
        with:
          packages: ${{ matrix.image == 'bridge' && 'labterm-bridge' || 'labterm-server' }}
          web: ${{ matrix.image == 'server' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.BUILD == 'true'
      - if: env.BUILD == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile${{ matrix.image != 'server' && format('.{0}', matrix.image) || '' }}
          platforms: linux/${{ matrix.arch }}
          # The binaries and the web cabinet come from the step above; each Dockerfile uses its own.
          build-args: |
            SERVER_STAGE=server-prebuilt
            WEB_STAGE=web-prebuilt
            BRIDGE_STAGE=bridge-prebuilt
          # Reads main's layer cache (written by server-images.yml); a PR never writes one, it would
          # only serve that PR and push main's Rust caches out of the repository's 10 GB.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
