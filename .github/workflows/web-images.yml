# Builds and pushes Labterm Web's labterm-web and labterm-relay images for every push to main that
# changes their inputs, as a stage of devel.yml after lint and tests passed (or by hand): tags dev
# and sha-<7>, amd64 for now, signed keyless with cosign, with SBOM and provenance. Release tags
# can later promote these digests without rebuilding. Pull requests only build them, in ci.yml.
name: Labterm Web images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Manual runs, and a push that is not a single step from the previous main build.
          if [ "$REF" != refs/heads/main ] || [ "$(git rev-parse HEAD^1 2>/dev/null)" != "$BEFORE" ]; then
            echo "build=true" | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$files"
          # What deploy/web/Dockerfile copies, plus this workflow.
          if grep -qE '^(apps/web/|apps/desktop/|crates/|Cargo\.(toml|lock)$|deploy/web/|\.github/workflows/web-images\.yml$)' <<<"$files"; then
            echo "build=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "build=false" | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        target: [web, relay]
        arch: [amd64] # arm64 when a cluster needs it: add it here; runners are picked below
    # Native runners per architecture: Rust under QEMU would take far too long.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/labterm-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=labterm-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=labterm-${{ matrix.target }}-${{ matrix.arch }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-digests-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [web, relay]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless: the workflow's identity signs
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: web-digests-${{ matrix.target }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Tag dev and sha-<7>, sign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/labterm-${{ matrix.target }}
          SHA: ${{ github.sha }}
        run: |
          short="sha-${SHA:0:7}"
          # sha-* tags never move; GHCR can't lock them, so a re-run leaves an existing one alone.
          if docker buildx imagetools inspect "$IMAGE:$short" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:$short already exists; left as is"
            exit 0
          fi
          refs=()
          for f in digests/*; do refs+=("$IMAGE@sha256:$(basename "$f")"); done
          docker buildx imagetools create -t "$IMAGE:$short" -t "$IMAGE:dev" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$short" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "$IMAGE@$digest"
          echo "### $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$short\` = \`$digest\` (also \`dev\`)" >> "$GITHUB_STEP_SUMMARY"
