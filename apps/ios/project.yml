# xcodegen spec — `xcodegen generate` produces Labterm.xcodeproj (not checked in).
# Run ./build-core.sh first so the LabtermCore package has its xcframework.
name: Labterm
options:
  bundleIdPrefix: dev.labdex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.12.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Sideload builds are signed by the user (AltStore/SideStore/Xcode); the
    # release archive is built with CODE_SIGNING_ALLOWED=NO. Simulator builds
    # are ad-hoc signed so Xcode embeds the keychain-access-groups /
    # application-identifier entitlements the Keychain needs. Set
    # CODE_SIGN_IDENTITY/DEVELOPMENT_TEAM locally in Xcode to run on a device.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  LabtermCore:
    path: LabtermCore

targets:
  Labterm:
    type: application
    platform: iOS
    sources:
      - path: Labterm
    dependencies:
      - package: LabtermCore
    info:
      path: Labterm/Resources/Info.plist
      properties:
        CFBundleDisplayName: Termoso
        CFBundleName: Labterm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Termoso connects to SSH servers on your local network.
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.labdex.labterm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lresolv"]

  LabtermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LabtermTests
    dependencies:
      - target: Labterm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.labdex.labterm.tests
        GENERATE_INFOPLIST_FILE: YES

  LabtermUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LabtermUITests
    dependencies:
      - target: Labterm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.labdex.labterm.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Labterm:
    build:
      targets:
        Labterm: all
        LabtermTests: [test]
        LabtermUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LabtermTests
        - LabtermUITests
    archive:
      config: Release
